# reload config
bind=SUPER+Alt,r,reload_config

# menu and terminal
bind=SUPER,space,spawn_shell,$HOME/.config/scripts/launch_vicinae.sh
bind=SUPER,Return,spawn,kitty
bind=SUPER+Alt,space,spawn_shell,$HOME/.config/scripts/vicinae-main-menu.sh
bind=SUPER,x,spawn,$HOME/.config/scripts/vicinae-power-menu.sh
bind=SUPER,w,spawn,$HOME/.config/scripts/launch_vicinae.sh awww
bind=SUPER+Shift,L,spawn,hyprlock

# exit super+m
# bind=SUPER,code:58,quit
# exit
bind=SUPER+SHIFT,q,quit
# killclient super+q
# bind=ALT,code:24,killclient,
bind=SUPER,q,killclient,

# switch window focus
bind=Alt,Tab,focusstack,next
# bind=SUPER,u,focuslast
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

