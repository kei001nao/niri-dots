# For more information visit https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

$scrPath      = ~/.config/hypr/hyprlock
$musicPath    = $scrPath/hyprlock-music.sh
$imgPath      = ~/.config/hypr/hyprlock/assets/music.webp

# WALLPAPER
# Just comment and uncomment to select
$wallpaper = /home/kei/Pictures/Wallpapers/Catppuccin/Dark/lofi-girl-013.png
$blur         = 2
$blur-size    = 7
$blur-noise   = 0.0117

# ADJUST HERE
$rounding     = 12
$shape-rd     = -1
$font-text    = GeistMono Nerd Font Bold
$font-text0   = GeistMono Nerd Font
$font-display = PP Neue Machina Ultra-Bold
$font-symbol  = JetBrainsMono Nerd Font Mono
# Input Var
$weight       = 2
$inner-color  = rgba(0, 0, 0, 0.5)
$border-color = rgba(255, 255, 255, 0.15)

# Colors
$clock-color  = rgba(255, 255, 255, 1)
$fg0          = rgba(255, 255, 255, 0.8)
$fg1          = rgba(0, 0, 0, 0.8)
$shape-col0   = rgba(255, 255, 255, 0.9)
$shape-col1   = rgba(0, 0, 0, 0.25)
$shape-col2   = rgba(255, 255, 255, 0.25)
$shadow-pass  = 2
$shadow-size  = 3
$shadow-color = rgb(0,0,0)
$shadow-boost = 1.2
$text-shadow-pass   = 1
$text-shadow-boost  = 0.5

source = $HOME/.config/hypr/hyprlock-color.conf

#-------------------------------------------------------
# GENERAL
general {
    no_fade_in          = true
    grace               = 1
    disable_loading_bar = false
    hide_cursor         = false
    ignore_empty_input  = true
    text_trim           = true
    transparent         = true
}

#BACKGROUND
background {
    monitor     = 
    path        = $wallpaper
    color       = rgba(25, 20, 20, 1.0)
    
    blur_passes         = $blur
    blur_size           = $blur-size
    noise               = $blur-noise
    contrast            = 0.8916
    brightness          = 0.7172
    vibrancy            = 0.1696
    vibrancy_darkness   = 0
}

#ANIMATIONS
animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

#-------------------------------------------------------
shape {
    monitor     =
    size        = 600, 740 

    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost

    color               = rgba(128, 128, 128, 0.15)
    rounding            = $rounding
    border_size         = 1
    border_color        = rgba(128, 128, 128, 0.3)


    position            = 0, 200
    halign              = center
    valign              = bottom
    zindex              = 0
}

# INPUT FIELD
input-field {
    monitor     =
    size        = 300, 50
    rounding    = $rounding
    
    outline_thickness   = $weight
    outer_color         = $border-color
    dots_size           = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing        = 0.4 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center         = true
    
    inner_color         = $inner-color
    font_color          = $fg0
    fade_on_empty       = false
    
    font_family         = $font-text
    placeholder_text    = <span foreground="##ffffff66">󰢏 Password...</span>
    hide_input          = false
    
    position            = 0, -240
    halign              = center
    valign              = center
    zindex              = 1
}

# TIME HR
label {
    monitor     =
    text        = cmd[update:1000] echo -e "$(date +"%H")" # 24-Hour Format
   #text        = cmd[update:1000] echo -e "$(date +"%I")" # 12-Hour Format
    color       = $color1
    
    shadow_pass         = $shadow-pass
    shadow_size         = $shadow-size
    shadow_color        = $shadow-color
    shadow_boost        = $shadow-boost
    
    font_size           = 150
    font_family         = $font-display 
    
    position            = 0, -155
    halign              = center
    valign              = top

    zindex              = 1

}

# TIME MM
label {
    monitor     =
    text        = cmd[update:1000] echo -e "$(date +"%M")"
    color       = $color2
    
    shadow_pass         = $shadow-pass
    shadow_size         = $shadow-size
    shadow_color        = $shadow-color
    shadow_boost        = $shadow-boost

    font_size           = 150
    font_family         = $font-display
    
    position            = 0, -325
    halign              = center
    valign              = top
    
    zindex              = 1

}

# DATE
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +"%m/%d/%Y")"
    
    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost

    color               = $color3
    font_size           = 22
    font_family         = $font-text

    position            = 0, -75
    halign              = center
    valign              = center

    zindex              = 1
}

# DAY
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +%A)"

    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost

    color               = $color2
    font_size           = 14
    font_family         = $font-text

    position            = 0, -115
    halign              = center
    valign              = center

    zindex              = 1
}

# BATTERY
label {
    monitor     =
    text        = cmd[update:1000] echo -e "$($scrPath/battery.sh)"
    
    color               = $fg1
    font_size           = 12
    font_family         = $font-text
    
    position            = -37, 29
    halign              = right
    valign              = bottom
    zindex              = 2
}

# BATTERY BG
shape {
    monitor     =
    size        = 90, 40
    
    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost

    color               = $shape-col0
    rounding            = $shape-rd
    border_size         = 
    border_color        =

    position            = -20, 20
    halign              = right
    valign              = bottom
    zindex              = 1
}

# ============================================================================
# Music Player Widget
# ============================================================================
# Player Background Box
# ----------------------------------------------------------------------------
shape {
    monitor     =
    size        = 600, 140 

    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost

    color               = rgba(128, 128, 128, 0.15)
    rounding            = $rounding
    border_size         = 1
    border_color        = rgba(128, 128, 128, 0.3)

    position            = 0, 40
    halign              = center
    valign              = bottom

    zindex = 0   
}

# ----------------------------------------------------------------------------
# Album Art
# ----------------------------------------------------------------------------
image {
    monitor =
    path = $imgPath
    size = 100
    rounding = 5
    border_size = 0
    border_color = rgba(169, 177, 214, 1)
    rotate = 0
    reload_time = 2
    reload_cmd = $musicPath --art
    position = 690, 57
    halign = left
    valign = bottom

    zindex = 1
}

# ----------------------------------------------------------------------------
# Track Information
# ----------------------------------------------------------------------------

# Song title
label {
    monitor =
    text = cmd[update:1000] echo "$($musicPath --title)"
    color = $color1
    font_size = 14
    font_family = JetBrainsMono Nerd Font Heavy
    position = 55, 138
    halign = center
    valign = bottom
    zindex = 1
}

# Player source (e.g., Spotify, Firefox)
label {
    monitor =
    text = cmd[update:1000] echo "$($musicPath --player)"
    color = $color2
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = 210, 45
    halign = center
    valign = bottom
    zindex = 1
}

# Artist name
label {
    monitor =
    text = cmd[update:1000] echo "$($musicPath --artist)"
    color = $color1
    font_size = 12
    font_family = JetBrainsMono Nerd Font Semibold
    position = 55, 118
    halign = center
    valign = bottom
    zindex = 1
}

# ----------------------------------------------------------------------------
# Playback Controls
# ----------------------------------------------------------------------------

# Previous track button
label {
    monitor =
    text = 󰒮
    color = $color1
    font_size = 25
    onclick = playerctl previous
    position = -5, 55
    halign = center
    valign = bottom
}

# Play/Pause button
label {
    monitor =
    text = cmd[update:1000] $musicPath --status
    color = $color1
    font_size = 25
    onclick = playerctl play-pause
    position = 55, 55
    halign = center
    valign = bottom
}

# Next track button
label {
    monitor =
    text = 󰒭
    color = $color1
    font_size = 25
    onclick = playerctl next
    position = 110, 55
    halign = center
    valign = bottom
}

# ----------------------------------------------------------------------------
# Progress Display
# ----------------------------------------------------------------------------

# Current position timestamp
label {
    monitor = 
    text = cmd[update:1000] echo "$($musicPath --position)"
    color = $color1
    font_size = 10
    font_family = SF Pro Display Medium
    position = -100, 95
    halign = center
    valign = bottom
}

# Total length timestamp
label {
    monitor = 
    text = cmd[update:1000] echo "$($musicPath --length)"
    color = $color1
    font_size = 10
    font_family = SF Pro Display Medium
    position = 210, 95
    halign = center
    valign = bottom
}

# Progress bar (with Pango markup for colored segments)
label {
    monitor = 
    text = cmd[update:1000] $musicPath --progress-bar
    color = $color1
    font_size = 12
    font_family = SF Pro Display Medium
    position = 55, 95
    halign = center
    valign = bottom
}
