# sample hypridle.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh     # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                        # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on                      # to avoid having to press a key twice to turn on the display.
}


# [ "$(cat /sys/class/power_supply/AC/online)" = "0" ] && hyprctl dispatch dpms off


listener {
    timeout = 150                                # 2min.
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = "0" ] && brightnessctl -s set 10
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 180                                # 3min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
#listener {
#    timeout = 150                                          # 2.5min.
#    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
#    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
#}


listener {
    timeout = 210                                 # 3.5min.
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = "0" ] && loginctl lock-session
}

listener {
    timeout = 240                                 # 4min.
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = "0" ] && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}


listener {
    timeout = 300                                 # 5min.
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = "1" ] && loginctl lock-session
}

listener {
    timeout = 330                                 # 5.5min.
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed.
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}


listener {
    timeout = 600                                 # 10min.
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = "0" ] && systemctl suspend
}

listener {
    timeout = 900                                 # 15min.
    on-timeout = systemctl suspend                # suspend pc.
}
